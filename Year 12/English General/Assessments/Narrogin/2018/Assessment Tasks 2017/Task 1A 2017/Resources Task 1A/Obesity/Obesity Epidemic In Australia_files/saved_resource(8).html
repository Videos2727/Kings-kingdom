
<!-- saved from url=(0055)https://masthead-widgets.domain.com.au/widget/masthead/ -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Domain SMH Masthead</title>
  <link href="./css" rel="stylesheet">
  <style type="text/css">
    html,
    body,
    div,
    span,
    applet,
    object,
    iframe,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    p,
    blockquote,
    pre,
    a,
    abbr,
    acronym,
    address,
    big,
    cite,
    code,
    del,
    dfn,
    em,
    img,
    ins,
    kbd,
    q,
    s,
    samp,
    small,
    strike,
    strong,
    sub,
    sup,
    tt,
    var,
    b,
    u,
    i,
    center,
    dl,
    dt,
    dd,
    ol,
    ul,
    li,
    fieldset,
    form,
    label,
    legend,
    table,
    caption,
    tbody,
    tfoot,
    thead,
    tr,
    th,
    td,
    article,
    aside,
    canvas,
    details,
    embed,
    figure,
    figcaption,
    footer,
    header,
    hgroup,
    menu,
    nav,
    output,
    ruby,
    section,
    summary,
    time,
    mark,
    audio,
    video {
      margin: 0;
      padding: 0;
      border: 0;
      font-size: 100%;
      font: inherit;
      vertical-align: baseline;
      font-family: 'Source Sans Pro', sans-serif
    }
    
    article,
    aside,
    details,
    figcaption,
    figure,
    footer,
    header,
    hgroup,
    menu,
    nav,
    section {
      display: block
    }
    
    body {
      line-height: 1
    }
    
    ol,
    ul {
      list-style: none
    }
    
    blockquote,
    q {
      quotes: none
    }
    
    blockquote:before,
    blockquote:after,
    q:before,
    q:after {
      content: '';
      content: none
    }
    
    table {
      border-collapse: collapse;
      border-spacing: 0
    }
    
    section {
      width: 940px;
      height: 275px;
      margin: auto;
      background: #fff
    }
    
    .main-title {
      width: 100%;
      border-bottom: 3px solid #e1e2e3
    }
    
    .headline-title {
      font-family: 'Montserrat', sans-serif;
      color: #1d1d1d;
      font-size: 1.5rem;
      text-align: left;
      font-weight: bold;
      padding-bottom: 10px;
      text-transform: uppercase
    }
    
    .item-card {
      display: inline-block;
      vertical-align: top;
      width: 224px;
      margin: 10px 10px 0 0
    }
    
    .item-card:last-child {
      display: inline-block;
      vertical-align: top;
      width: 227px;
      margin: 10px 0
    }
    
    .item-card .logo-container {
      width: 220px;
      text-align: left;
      padding: 5px 0
    }
    
    .item-card .content-container {
      border-left: 1px solid #ededed;
      border-right: 1px solid #ededed;
      border-bottom: 1px solid #ededed;
      background: transparent;
      transition: background .2s ease
    }
    
    .item-card .content-container:hover {
      background: #f7f7f8;
      transition: background .2s ease
    }
    
    .item-card .logo-container img {
      height: 20px;
      width: auto;
      background: transparent
    }
    
    .item-card img {
      width: 100%;
      height: 80px;
      display: block;
      background: #f7f7f8
    }
    
    .item-card .text-container {
      width: 80%;
      padding: 10px 0;
      margin: auto;
      display: block;
      text-align: left
    }
    
    .item-card .headline {
      display: block;
      font-size: 13px;
      line-height: 20px;
      margin-bottom: 5px;
      white-space: nowrap
    }
    
    .item-card .bodytext {
      display: block;
      font-size: 12px;
      line-height: 16px;
      width: 100%;
      color: #5c5c5c;
      text-align: left;
      margin: auto;
      height: 32px;
      -webkit-font-smoothing: antialiased
    }
    
    .item-card .cta-container {
      width: 220px;
      display: block;
      padding-bottom: 20px
    }
    
    .item-card a {
      text-decoration: none;
      color: #263248
    }
    
    .item-card .cta {
      width: 80%;
      display: block;
      text-align: center;
      padding: 7px 0;
      background: transparent;
      border: 1px solid #cacbcd;
      color: #7b7b7b;
      text-transform: uppercase;
      margin-top: 20px;
      margin: auto;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      transition: all .2s ease
    }
    
    .item-card .cta:hover {
      background: #007ac7;
      border: 1px solid #007ac7;
      color: #fff;
      transition: all .2s ease
    }
    
    @media only screen and (max-width:769px) {
      section {
        width: 100%
      }
      .item-card:last-child {
        display: none
      }
    }
    
    @media only screen and (max-width:767px) {
      section {
        width: 100%
      }
      .item-card:first-child {
        display: block
      }
      .item-card:last-child {
        display: none
      }
      .item-card:nth-of-type(3) {
        display: none
      }
      .item-card:nth-of-type(4) {
        display: none
      }
    }
  </style>
</head>

<body>
  <section>
    <div class="main-title">
      <h2 class="headline-title">COMPARE &amp; SAVE</h2>
    </div>
    <div class="item-card">
      <iframe width="227" height="208" scrolling="no" src="./adx(1).html"></iframe>
    </div>
    <div class="item-card">
      <iframe width="227" height="208" scrolling="no" src="./adx(2).html"></iframe>
    </div>
    <div class="item-card">
      <iframe width="227" height="208" scrolling="no" src="./adx(3).html"></iframe>
    </div>
    <div class="item-card">
      <iframe width="227" height="208" scrolling="no" src="./adx(4).html"></iframe>
    </div>
  </section>


</body></html>
