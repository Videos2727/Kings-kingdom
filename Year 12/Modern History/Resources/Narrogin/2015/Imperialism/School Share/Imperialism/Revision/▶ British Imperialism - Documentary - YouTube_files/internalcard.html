,,["tsg.hy","UCLvJzyi6P1qHbEKjqgA9GPg","MrGreekDocumentary","Ancient Greece was an ancient civilization belonging to a period of Greek history that lasted from the Archaic period of the 8th to 6th centuries BC to the end of antiquity (ca. 600 AD). Immediately following this period was the beginning of the Early Middle Ages and the Byzantine era.[1] Included in Ancient Greece is the period of Classical Greece, which flourished during the 5th to 4th centuries BC. Classical Greece began with the repelling of a Persian invasion by Athenian leadership. Because of conquests by Alexander the Great, Hellenistic civilization flourished from Central Asia to the western end of the Mediterranean Sea.\n\nClassical Greek culture, especially philosophy, had a powerful influence on the Roman Empire, which carried a version of it to many parts of the Mediterranean region and Europe, for which reason Classical Greece is generally considered to be the seminal culture which provided the foundation of modern Western culture.","https://yt3.ggpht.com/-RtJIJEpVqlQ/AAAAAAAAAAI/AAAAAAAAAAA/OioyOh3WwCQ/s88-c-k-no/photo.jpg",,10510,0,"MrGreekDocumentary",[]
