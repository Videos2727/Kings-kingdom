&lt;body dir=&quot;auto&quot;&gt;
&lt;div style=&quot;direction:ltr; font-family:Tahoma; color:#000000; font-size:10pt&quot;&gt;Hi Hayden&lt;br&gt;
&lt;br&gt;
Thank you so much for your reply. I was so worrying, why Hayden not replying to me or do I have to make investigation by myself due to time shortage. Anyway I feel bit relaxed now.
&lt;br&gt;
&lt;br&gt;
I have done NC (4.2 unit) yesterday. Students doing Experiment 4.2 tomorrow, will continue with 10.1 to 10.3 of Chem for WA 1 (PP notes through connect).&amp;nbsp; Then 4.4&amp;nbsp; As soon as I get investigation from you, I&amp;nbsp; will be working with that.
&lt;br&gt;
&lt;br&gt;
What about nanotechnology concept?&lt;br&gt;
&lt;br&gt;
Regards&lt;br&gt;
Jijy&lt;br&gt;
&lt;div style=&quot;font-family:Times New Roman; color:#000000; font-size:16px&quot;&gt;
&lt;hr tabindex=&quot;-1&quot;&gt;
&lt;div id=&quot;divRpF682561&quot; style=&quot;direction:ltr&quot;&gt;&lt;font face=&quot;Tahoma&quot; color=&quot;#000000&quot; size=&quot;2&quot;&gt;&lt;b&gt;From:&lt;/b&gt; MCKENNA Hayden [Bunbury Senior High School]&lt;br&gt;
&lt;b&gt;Sent:&lt;/b&gt; Wednesday, 6 May 2015 9:35 AM&lt;br&gt;
&lt;b&gt;To:&lt;/b&gt; D'CRUZ Jijy [Safety Bay Senior High School]&lt;br&gt;
&lt;b&gt;Subject:&lt;/b&gt; RE: Energy effects&lt;br&gt;
&lt;/font&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;&lt;/div&gt;
&lt;div&gt;
&lt;div style=&quot;direction:ltr; font-family:Arial; color:#000000; font-size:10pt&quot;&gt;Hi Jijy,
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;Sorry for not being more organised!&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;I am hoping to do the investigation tonight, and have the exam stuff done by the weekend.&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;I will be doing the investigation (whatever it is!) next week. I was thinking of an experiment that would require students to compare the energy output of different fuels.&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;They will probably need to do one example first (e.g. similar to the worked example 4.7 in the textbook). The they could need to prepare an investigation that compares energy outputs of different fuels.&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;For my schedule it will probably be...&lt;/div&gt;
&lt;div&gt;
&lt;ul&gt;
&lt;li&gt;Wednesday (today): Teaching content from Chapter 4&lt;/li&gt;&lt;li&gt;Thursday: Teaching content from Chapter 4&lt;/li&gt;&lt;li&gt;Monday: Example experiment to measure heat of combustion for a single fuel (similar to Investigation 4.1 in the book but tell them the instructions to speed things up)&lt;/li&gt;&lt;li&gt;Tuesday: Processing data, start planning investigation (complete at home if necessary)&lt;/li&gt;&lt;li&gt;Wednesday: Complete experiment in class&lt;/li&gt;&lt;li&gt;Thursday: Have an open-book test where they need to process their data&lt;/li&gt;&lt;/ul&gt;
&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;Will be very packed!!!!!&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;- Hayden&lt;br&gt;
&lt;div style=&quot;font-family:Times New Roman; color:#000000; font-size:16px&quot;&gt;
&lt;hr tabindex=&quot;-1&quot;&gt;
&lt;div id=&quot;divRpF324766&quot; style=&quot;direction:ltr&quot;&gt;&lt;font face=&quot;Tahoma&quot; color=&quot;#000000&quot; size=&quot;2&quot;&gt;&lt;b&gt;From:&lt;/b&gt; D'CRUZ Jijy [Safety Bay Senior High School]&lt;br&gt;
&lt;b&gt;Sent:&lt;/b&gt; Tuesday, 5 May 2015 6:21 AM&lt;br&gt;
&lt;b&gt;To:&lt;/b&gt; MCKENNA Hayden [Bunbury Senior High School]&lt;br&gt;
&lt;b&gt;Subject:&lt;/b&gt; RE: Energy effects&lt;br&gt;
&lt;/font&gt;&lt;br&gt;

&lt;div&gt;
&lt;div style=&quot;direction:ltr; font-family:Tahoma; color:#000000; font-size:10pt&quot;&gt;Hi Hayden
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;Have you had a chance to make investigation for the students to use on next week. Any modification has done for our Sem-1 exam paper, if you have done can I have a copy of the same please.&amp;nbsp;&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;Kind regards&lt;/div&gt;

&lt;br&gt;
There was some typo in my earlier email, please read in this way about the girl I mentioned is achieving very low in Chemistry in most assessment tasks due to ongoing sick leave ( I wrote very low Chem assessment tasks, please excuse me). This is in her other
 subjects too. I have sent a letter of concern ( will be send like SMS from SS and parents will contact me later) to the parent of this girl and others failed in this test today at school.&lt;br&gt;
&lt;br&gt;
Regards&lt;br&gt;

&lt;br&gt;
&lt;br&gt;
I have attached one sheet on nanotechnology, please have a look at this. See whether we will be able to give this to students and ask them to complete by themselves and we can go through this sheet as a whole class discussion and if possible we can put some
 questions based on this in the Sem -1 exam paper -----? What do you say? or do you have any other idea. I have conducted test -3 on last Friday. Two students still need to do this test, about four students achieved below 50%. One student I can see in Chem
 class only a day or two in a week due to sickness and this is really affecting her results across all learning areas( very low Chem assessment tasks). Highest so far I got was 79% ( Ella) Imelda was absent on the test day not yet done.&lt;br&gt;
&lt;br&gt;
Most of them made mistakes with the hydrocarbon reactions and structural formula Q's. I am conducting &amp;quot; reactivity of hydrocarbons&amp;quot; prac on this Friday with my class.&lt;br&gt;
&lt;br&gt;
Assessment free week for our Year 11's is on Week -6 ( may start on Friday week-5 onwards) Year-11 exam starts on Friday of week-6.
&lt;br&gt;
&lt;br&gt;
I think photocopying of Year 11 exam's will be on Week-5 in our school and must give correct number of papers to admin, don't know yet. ( In previous years this was the trend).&lt;br&gt;
&lt;br&gt;
Will you able to send a copy of the semester-1 exam when you have finished the changes as some of the Q's really need change.&lt;br&gt;
&lt;br&gt;
I thought to start 4.2 lesson from energy changes topic on Monday onwards, then from Chem for WA 1 ( Ch: 10) will be covering like PP notes. Once done, asking students to do set Q's from 4.3 &amp;amp; 4.4. Then investigation once I get from you.
&lt;br&gt;
&lt;br&gt;
Regards&lt;br&gt;
Jijy&lt;br&gt;

&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;Nanotech and history of atom I didn't have time for. One possibility is I might find an article or two and put them on Connect and just say 'this could be in the exam -- go and read it'.&amp;nbsp;&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;Our exams are in week 6/7 too. When do your exams have to be in for photocopying?&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;There will be an investigation before the exam but will depend on how much time is available. I'm doing my chapter 3 test on Monday. Our school has an assessment moratorium during Week 5 so any investigation will need to take place during Week 4 for us.&amp;nbsp;&lt;br&gt;
&lt;br&gt;
