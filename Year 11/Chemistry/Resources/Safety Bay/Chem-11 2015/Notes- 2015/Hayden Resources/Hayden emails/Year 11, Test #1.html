<textarea id="txtBdy" class="whPlainText txtBdy" style="display:none">&lt;html dir=&quot;ltr&quot;&gt;
&lt;head&gt;
&lt;style type=&quot;text/css&quot; id=&quot;owaParaStyle&quot;&gt;&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div style=&quot;direction:ltr; font-family:Arial; color:#000000; font-size:10pt&quot;&gt;
&lt;div style=&quot;direction:ltr; font-family:Arial; color:#000000; font-size:10pt&quot;&gt;Today my Year 11 students did the stoichiometry test that I emailed earlier.
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;Only mistake that was found was I balanced equation for the iron(II) oxide &amp;#43; carbon monoxide reaction. Coefficients should be
&lt;b&gt;1, 3, 2 and 3&lt;/b&gt; for part a. It doesn't affect the answers (still same mole ratio)&lt;span style=&quot;font-size:13.3333330154419px&quot;&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;
&lt;div style=&quot;font-size:13.3333330154419px&quot;&gt;The mean was 61% with scores ranging from 22% to 88%. Time was an issue with students but partly this is because they were slow to do calculations. Also a lot of students found 8c really difficult and spent far too
 much time here for something that is only worth 2 marks, so I will need to speak to my class about time management and when to skip questions in tests.&lt;/div&gt;
&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;For question 3 of short answer a lot of students went a different direction with their answer and defined Mr as
&lt;i&gt;'the sum of the relative atomic masses of atoms in a molecule'&lt;/i&gt;. I gave this one mark provided that they used the term
&lt;u&gt;relative&lt;/u&gt;&amp;nbsp;atomic masses (not just &amp;quot;sum of the atomic masses&amp;quot; or &amp;quot;total mass of atoms&amp;quot;, etc).&amp;nbsp;&lt;span style=&quot;font-size:10pt&quot;&gt;For that same question I gave 0.5 marks to responses that were on the right track but missed minor information (e.g. &amp;quot;relative to
 1/12th of a carbon atom&amp;quot; or &amp;quot;relative to a carbon-12 atom&amp;quot;)&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;br&gt;
&lt;/div&gt;
&lt;div&gt;Question 1 &amp;amp; 2 of short answer as usual were either mostly good or mostly terrible, depending on whether students have taken the time to go and learn their ions. It was pretty evident when they had not&lt;span style=&quot;font-size:13.3333330154419px&quot;&gt;.&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;span style=&quot;font-size:13.3333330154419px&quot;&gt;&lt;br&gt;
&lt;/span&gt;&lt;/div&gt;
&lt;div&gt;&lt;span style=&quot;font-size:13.3333330154419px&quot;&gt;- Hayden&lt;/span&gt;&lt;/div&gt;
&lt;/div&gt;
&lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;
</textarea>
